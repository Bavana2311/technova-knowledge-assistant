llm:
  provider: "gemini"
  model_openai: "gpt-4o-mini"
  model_gemini: "gemini-2.5-flash"
  temperature: 0.3
  max_tokens: 1000

embedding:
  openai_model: "text-embedding-3-small"
  gemini_model: "models/gemini-embedding-001"

vectordb:
  faiss_openai: "./data/embeddings/faiss_openai"
  faiss_gemini: "./data/embeddings/faiss_gemini"

retrieval:
  top_k: 5 # Number of top documents to retrieve from each retriever

fusion:
  weights:
    faiss: 0.5
    bm25: 0.3
    sqlite: 0.2
  normalize_scores: true
  final_k: 5

hybrid:
  k_semantic: 5 #Take the top 5 results from FAISS.
  k_sparse: 5 #Take the top 5 results from BM25.
  weights: [0.6, 0.4] #0.6 → Semantic/FAISS, 0.4 → BM25
  normalize: true #Convert the scores to a comparable range before combining them.
  
bm25:
  k1: 1.5
  b: 0.75

reranking:
  cross_encoder_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  max_chars: 1200
